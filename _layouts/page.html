---
layout: default
---
<article class="page">
  {% unless page.hide_title %}
  <header class="page-header">
    <h1 class="page-title">{{ page.title }}</h1>
    {% if page.description %}<p class="lede">{{ page.description }}</p>{% endif %}
  </header>
  {% endunless %}
  <div class="prose">
    {{ content }}
  </div>
</article>
