# ---------------------------------------------------------------------------
# Site
# ---------------------------------------------------------------------------
title: Ali Emre Narin
tagline: Researcher · Builder
description: Personal website of Ali Emre Narin — research, writing, and reading.
url: https://alinarin.site
baseurl: ""
lang: en
author:
  name: Ali Emre Narin
  email: aliemre2024@gmail.com

# Top navigation, in order.
nav:
  - title: about
    url: /
  - title: publications
    url: /publications/
  - title: blog
    url: /blog/
  - title: library
    url: /library/
  - title: cv
    url: /cv/

# ---------------------------------------------------------------------------
# Content
# ---------------------------------------------------------------------------
permalink: /blog/:year/:slug/

collections:
  books:
    output: false

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: page

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight

excerpt_separator: <!--more-->

# ---------------------------------------------------------------------------
# Plugins
# ---------------------------------------------------------------------------
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-scholar

feed:
  path: feed.xml

scholar:
  last_name: [Narin]
  first_name: [Ali Emre, Ali, A. E., A.]
  style: apa
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  replace_strings: true
  join_strings: true
  sort_by: year, month
  order: descending
  group_by: year
  group_order: descending
  query: "@*"

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - package.json
  - package-lock.json
  - bin
  - README.md
  - CLAUDE.md
  - LICENSE
  - _config_preview.yml
  - .prettierrc
  - .prettierignore

include:
  - _pages
